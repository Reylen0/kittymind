<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>KittyMind Pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 200px; height: 323px;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #root { position: relative; width: 200px; height: 323px; }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }

    #bubble {
      position: absolute;
      top: 4px; left: 50%;
      transform: translateX(-50%);
      max-width: 188px;
      background: rgba(255,255,255,0.96);
      color: #1e1e2e;
      font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      font-size: 11px;
      line-height: 1.4;
      padding: 6px 10px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      white-space: pre-wrap;
      word-break: break-all;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 10;
    }
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(255,255,255,0.96);
      border-bottom: none;
    }
    #bubble.visible { opacity: 1; }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
<div id="root">
  <div id="bubble"></div>
  <div id="loading">加载中…</div>
  <canvas id="canvas" width="200" height="323"></canvas>
</div>

<script>
'use strict'

// ─── Emotion State Machine ─────────────────────────────────────────────────────
const Emotion = Object.freeze({
  IDLE: 'idle', THINKING: 'thinking', WORKING: 'working',
  HAPPY: 'happy', SAD: 'sad', SLEEPY: 'sleepy', ALERT: 'alert',
})

let emotion      = Emotion.IDLE
let emotionTimer = null
let lastActivity = Date.now()

function setEmotion(name, durationMs = 0) {
  emotion = name
  lastActivity = Date.now()
  clearTimeout(emotionTimer)
  if (durationMs > 0) emotionTimer = setTimeout(() => setEmotion(Emotion.IDLE), durationMs)
}

setInterval(() => {
  if (Date.now() - lastActivity > 20 * 60 * 1000 && emotion === Emotion.IDLE)
    setEmotion(Emotion.SLEEPY)
}, 30000)

// ─── Layer groups ──────────────────────────────────────────────────────────────
const HEAD_LAYERS = new Set(['headwear', 'face', 'mouth', 'eyewhite', 'irides',
                              'eyebrow', 'eyelash', 'front hair', 'earwear', 'ears', 'nose'])
const EYE_LAYERS  = new Set(['eyewhite', 'irides', 'eyelash'])

const DST_W = 200, DST_H = 323

// ─── Renderer state ────────────────────────────────────────────────────────────
let layers   = []
let cropRect = { x: 0, y: 0, w: DST_W, h: DST_H }
let rafId    = null
let loading  = false

const canvas    = document.getElementById('canvas')
const ctx       = canvas.getContext('2d')
const loadingEl = document.getElementById('loading')

// ─── Blink state ──────────────────────────────────────────────────────────────
let blinkCooldown = 3 + Math.random() * 3
let blinkElapsed  = 0
let blinking      = false
let eyeAlpha      = 1

// ─── Load character ───────────────────────────────────────────────────────────
async function loadCharacter(model) {
  if (loading) return
  loading = true

  if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null }
  ctx.clearRect(0, 0, DST_W, DST_H)
  loadingEl.style.display = 'flex'

  try {
    const BASE     = `./layers/${model}/`
    const manifest = await fetch(BASE + 'manifest.json').then(r => r.json())

    // Crop from manifest; fallback to full source canvas
    cropRect = manifest.crop ?? { x: 0, y: 0, w: manifest.width, h: manifest.height }

    // Parallel image loading
    layers = (await Promise.all(
      manifest.layers
        .filter(l => l.file && !l.hidden)
        .map(({ name, file }) => new Promise(res => {
          const img = new Image()
          img.onload  = () => res({ name, img })
          img.onerror = () => { console.warn('layer load failed:', name); res(null) }
          img.src = BASE + file
        }))
    )).filter(Boolean)
  } catch (e) {
    loadingEl.textContent = '加载失败: ' + e.message
    loading = false
    return
  }

  loadingEl.style.display = 'none'
  loading = false

  // Reset blink state
  blinkCooldown = 3 + Math.random() * 3
  blinkElapsed = 0
  blinking = false
  eyeAlpha = 1

  // ─── Render loop ─────────────────────────────────────────────────────────────
  let prevTs = 0
  function render(ts) {
    const dt = Math.min((ts - prevTs) / 1000, 0.05)
    prevTs = ts
    const t  = ts / 1000

    ctx.clearRect(0, 0, DST_W, DST_H)

    let bodyOffX = 0, bodyOffY = 0, headRot = 0, headOffY = 0, bodyScale = 1

    switch (emotion) {
      case Emotion.IDLE:
        bodyOffY = Math.sin(t * 1.1) * 2.5
        break
      case Emotion.ALERT:
        bodyOffY = Math.sin(t * 1.1) * 2.5
        bodyScale = 1 + Math.abs(Math.sin(t * 8)) * 0.02
        break
      case Emotion.THINKING:
        bodyOffY = Math.sin(t * 0.8) * 2
        headRot  = Math.sin(t * 2.2) * 0.07
        break
      case Emotion.WORKING:
        bodyOffX = Math.sin(t * 14) * 1.8
        bodyOffY = Math.sin(t * 9)  * 1.5
        break
      case Emotion.HAPPY:
        bodyOffY = -Math.abs(Math.sin(t * 5.5)) * 6
        headOffY = bodyOffY * 0.5
        break
      case Emotion.SAD:
        bodyOffY = Math.sin(t * 0.6) * 1.5
        headRot  = -0.06
        break
      case Emotion.SLEEPY:
        bodyOffY = Math.sin(t * 0.4) * 2.5
        headRot  = Math.sin(t * 0.3) * 0.08 + 0.06
        break
    }

    // Blink update
    blinkElapsed += dt
    if (!blinking && blinkElapsed >= blinkCooldown) {
      blinking = true; blinkElapsed = 0
    }
    if (blinking) {
      const BLINK_DUR = 0.18, CLOSE_END = 0.06
      if (blinkElapsed < CLOSE_END) {
        eyeAlpha = 1 - blinkElapsed / CLOSE_END
      } else if (blinkElapsed < BLINK_DUR) {
        eyeAlpha = (blinkElapsed - CLOSE_END) / (BLINK_DUR - CLOSE_END)
      } else {
        eyeAlpha = 1; blinking = false; blinkElapsed = 0
        blinkCooldown = 3 + Math.random() * 4
      }
      eyeAlpha = Math.max(0, Math.min(1, eyeAlpha))
    }

    // SLEEPY: eyes mostly closed (slow half-sine keeps a sliver open)
    const effectiveEyeAlpha = emotion === Emotion.SLEEPY
      ? Math.min(eyeAlpha, 0.15 + Math.abs(Math.sin(t * 0.4)) * 0.12)
      : eyeAlpha

    const PIVOT_X = DST_W * 0.5
    const PIVOT_Y = DST_H * 0.33

    for (const { name, img } of layers) {
      const isEye  = EYE_LAYERS.has(name)
      const isHead = HEAD_LAYERS.has(name)

      ctx.save()
      if (isEye) ctx.globalAlpha = effectiveEyeAlpha

      if (isHead) {
        ctx.translate(PIVOT_X, PIVOT_Y + headOffY)
        ctx.rotate(headRot)
        ctx.translate(-PIVOT_X, -(PIVOT_Y + headOffY))
      }

      if (bodyScale !== 1) {
        ctx.translate(DST_W / 2, DST_H / 2)
        ctx.scale(bodyScale, bodyScale)
        ctx.translate(-DST_W / 2, -DST_H / 2)
      }

      ctx.drawImage(img, cropRect.x, cropRect.y, cropRect.w, cropRect.h,
                    bodyOffX, bodyOffY, DST_W, DST_H)
      ctx.restore()
    }

    rafId = requestAnimationFrame(render)
  }
  rafId = requestAnimationFrame(render)
}

// ─── Agent events ──────────────────────────────────────────────────────────────
if (window.pet) {
  window.pet.on('agent.start',      () => setEmotion(Emotion.ALERT,   800))
  window.pet.on('agent.thinking',   () => setEmotion(Emotion.THINKING, 0))
  window.pet.on('agent.tool_call',  () => setEmotion(Emotion.WORKING,  0))
  window.pet.on('agent.done',  (d) => { setEmotion(Emotion.HAPPY, 4000); if (d?.text) showBubble(d.text) })
  window.pet.on('agent.error',      () => setEmotion(Emotion.SAD,    4000))
  window.pet.on('pet.switch-model', (d) => loadCharacter(d?.model ?? 'deepseek').catch(console.error))
}

loadCharacter('deepseek').catch(e => {
  loadingEl.textContent = '加载失败: ' + e.message
  console.error(e)
})

// ─── Speech Bubble ─────────────────────────────────────────────────────────────
const bubble    = document.getElementById('bubble')
let bubbleTimer = null
function showBubble(text) {
  const max = 40
  bubble.textContent = text.length > max ? text.slice(0, max) + '…' : text
  bubble.classList.add('visible')
  clearTimeout(bubbleTimer)
  bubbleTimer = setTimeout(() => bubble.classList.remove('visible'), 6000)
}

// ─── Drag ──────────────────────────────────────────────────────────────────────
let dragging = false, startMouse = null, startWin = null

canvas.addEventListener('mousedown', async (e) => {
  if (e.button !== 0) return
  dragging   = true
  startMouse = { x: e.screenX, y: e.screenY }
  startWin   = await window.pet?.getWindowBounds() ?? { x: 0, y: 0 }
  e.preventDefault()
})
window.addEventListener('mousemove', (e) => {
  if (!dragging || !startMouse) return
  window.pet?.move(startWin.x + (e.screenX - startMouse.x), startWin.y + (e.screenY - startMouse.y))
})
window.addEventListener('mouseup', async () => {
  if (!dragging) return
  dragging = false
  await window.pet?.snapToEdge()
})

canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); window.pet?.showContextMenu() })
</script>
</body>
</html>
