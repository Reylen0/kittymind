<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>KittyMind Pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width:      180px;
      height:     180px;
      background: transparent;
      overflow:   hidden;
    }

    .pet-wrap {
      width:          180px;
      height:         180px;
      display:        flex;
      align-items:    center;
      justify-content:center;
      /* drag the whole window by clicking anywhere */
      -webkit-app-region: drag;
      cursor: grab;
    }

    .sprite {
      font-size: 80px;
      line-height: 1;
      transition: transform 0.25s ease, filter 0.25s ease;
      /* prevent drag on the emoji itself so right-click still works */
      -webkit-app-region: no-drag;
      user-select: none;
    }

    .sprite.thinking { animation: wobble 0.6s ease infinite alternate; }
    .sprite.working  { animation: bounce 0.4s ease infinite alternate; }
    .sprite.happy    { animation: pop    0.3s ease; }
    .sprite.sad      { filter: brightness(0.7) saturate(0.4); }

    @keyframes wobble {
      from { transform: rotate(-8deg); }
      to   { transform: rotate( 8deg); }
    }
    @keyframes bounce {
      from { transform: translateY(0);   }
      to   { transform: translateY(-8px); }
    }
    @keyframes pop {
      0%   { transform: scale(1);   }
      50%  { transform: scale(1.3); }
      100% { transform: scale(1);   }
    }
  </style>
</head>
<body>
  <div class="pet-wrap">
    <span class="sprite" id="pet">🐱</span>
  </div>

  <script>
    const pet = document.getElementById('pet')

    const STATES = {
      idle:     { emoji: '🐱', cls: '' },
      thinking: { emoji: '🤔', cls: 'thinking' },
      working:  { emoji: '🔧', cls: 'working' },
      happy:    { emoji: '😊', cls: 'happy' },
      sad:      { emoji: '😢', cls: 'sad' },
    }

    let resetTimer = null

    function setState(name, duration = 3000) {
      const s = STATES[name] || STATES.idle
      pet.textContent = s.emoji
      pet.className   = 'sprite ' + s.cls
      clearTimeout(resetTimer)
      if (duration) resetTimer = setTimeout(() => setState('idle', 0), duration)
    }

    if (window.pet) {
      window.pet.on('agent.thinking',   () => setState('thinking', 0))
      window.pet.on('agent.tool_call',  d  => setState('working',  0))
      window.pet.on('agent.done',       () => setState('happy',  2500))
      window.pet.on('agent.error',      () => setState('sad',    3000))
      window.pet.on('agent.start',      () => setState('thinking', 0))
    }

    // Double-click to toggle click-through
    let clickThrough = false
    pet.addEventListener('dblclick', () => {
      clickThrough = !clickThrough
      if (window.pet) window.pet.setClickThrough(clickThrough)
    })
  </script>
</body>
</html>
